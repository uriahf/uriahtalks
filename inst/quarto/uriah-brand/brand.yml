meta:
  name: Uriah Finkel

color:
  palette:
    ink: "#10212b"
    navy: "#173f55"
    blue: "#2f6f8f"
    mist: "#e8f2f6"
    line: "#cfdee5"
    paper: "#f8fbfc"
    white: "#ffffff"
    green: "#39735c"
    red: "#a64b55"
  foreground: ink
  background: paper
  primary: blue
  secondary: navy
  tertiary: mist
  success: green
  info: blue
  warning: navy
  danger: red
  light: paper
  dark: ink

typography:
  fonts:
    - family: Commissioner
      source: file
      files:
        - path: fonts/commissioner-v13-latin-regular.woff2
          weight: 400
          style: normal
        - path: fonts/commissioner-v13-latin-regular.woff
          weight: 400
          style: normal
    - family: Fraunces
      source: file
      files:
        - path: fonts/Fraunces9pt-Light.woff2
          weight: 300
          style: normal
  base:
    family: Commissioner
    weight: 400
    line-height: 1.6
  headings:
    family: Fraunces
    weight: 300
    line-height: 1.15
  link:
    color: primary

